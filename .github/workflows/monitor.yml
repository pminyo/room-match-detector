name: RoomMatch watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar un mensaje de prueba en vez de comprobar anuncios"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roommatch-watcher
  cancel-in-progress: false

env:
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FILTERS_JSON: ${{ vars.FILTERS_JSON }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar notificacion de prueba
        if: ${{ inputs.test }}
        run: python monitor.py --test-notify

      - name: Buscar anuncios nuevos
        if: ${{ !inputs.test }}
        run: python monitor.py

      - name: Guardar estado
        if: ${{ success() && !inputs.test }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "roommatch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update roommatch state [skip ci]"
            git push
          fi
